<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <div class="dropdown" id="civDropdown">
        <button class="dropbtn" onclick="toggleDropdown()">Civs ▼</button>
        <div class="dropdown-content">
          <a href="athen.html"><button>Athenians</button></a>
          <a href="brit.html"><button>Britons</button></a>
          <a href="cart.html"><button>Carthaginians</button></a>

    </nav>

    <div class="main-content">
      <div class="logo">
        <img src="logo.png" alt="Classical Warfare AEA Logo">
      </div>

      <div class="container">
        <div class="container2">
          <h1>Community Screenshots</h1>
          <p>Submit screenshots to the forum to have them featured here</p>

          <img class="screenshot" src="bgs/bg2.png" alt="Game Screenshot 2">

        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('civDropdown');
      dropdown.classList.toggle('active');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      const dropdown = document.getElementById('civDropdown');
      if (!dropdown.contains(event.target)) {
        dropdown.classList.remove('active');
      }
    });
  </script>
</body>
